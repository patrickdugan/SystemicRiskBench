name: Core validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stdlib-tests-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python modules
        run: python -m compileall -q systemic_risk_bench adapters scripts tests
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate source corpus and reference calculators
        run: python -m systemic_risk_bench validate
      - name: Run zero-model-call reference smoke
        run: python -m systemic_risk_bench smoke --output-dir artifacts/reference
